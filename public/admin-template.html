<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Template — Pub Quiz Daily</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf9f7; --ink: #1a1a1a; --ink-light: #6b6b6b; --ink-faint: #c8c8c8;
      --border: #e0ddd8; --correct: #4a7c59; --correct-bg: #edf4ef;
      --accent: #2a52be;
      --font-serif: 'Libre Baskerville', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    body { background: #d0cec9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 24px; font-family: var(--font-sans); gap: 32px; }

    /* ── Password gate ── */
    #gate { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 40px 36px; width: 100%; max-width: 380px; text-align: center; }
    #gate h2 { font-family: var(--font-serif); font-size: 1.2rem; margin-bottom: 8px; color: var(--ink); }
    #gate p { font-size: 0.875rem; color: var(--ink-light); margin-bottom: 24px; }
    #gate input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; font-family: var(--font-sans); font-size: 1rem; color: var(--ink); background: var(--cream); outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 0.1em; }
    #gate input:focus { border-color: var(--accent); }
    #gate button { width: 100%; background: var(--ink); color: white; border: none; border-radius: 8px; padding: 12px; font-family: var(--font-sans); font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
    #gate button:hover { background: #333; }
    #gate-error { color: #c0392b; font-size: 0.85rem; margin-top: 10px; display: none; }

    #main { display: none; width: 100%; align-items: center; flex-direction: column; gap: 32px; }

    /* ── Controls ── */
    .controls { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 28px 32px; width: 100%; max-width: 600px; }
    .controls h2 { font-family: var(--font-serif); font-size: 1.1rem; margin-bottom: 20px; color: var(--ink); }

    .fetch-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .btn-fetch { flex: 1; background: var(--accent); color: white; border: none; border-radius: 8px; padding: 12px 18px; font-family: var(--font-sans); font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
    .btn-fetch:hover { background: #1e3fa0; }
    .btn-fetch:disabled { background: var(--ink-faint); cursor: not-allowed; }
    #fetch-status { font-size: 0.85rem; color: var(--ink-light); min-width: 140px; }
    #fetch-status.ok { color: var(--correct); }
    #fetch-status.err { color: #c0392b; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-light); margin-bottom: 6px; }
    .field input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-family: var(--font-sans); font-size: 0.9375rem; color: var(--ink); background: var(--cream); outline: none; }
    .field input:focus { border-color: var(--accent); }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
    .btn-export { background: var(--correct); color: white; border: none; border-radius: 8px; padding: 13px; font-family: var(--font-sans); font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
    .btn-export:hover { background: #3a6347; }
    .btn-export:disabled { background: var(--ink-faint); cursor: not-allowed; }
    .btn-print { background: var(--ink); color: white; border: none; border-radius: 8px; padding: 13px; font-family: var(--font-sans); font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
    .btn-print:hover { background: #333; }
    .hint { margin-top: 10px; font-size: 0.8rem; color: var(--ink-light); text-align: center; line-height: 1.5; }

    /* ── 1080×1080 card ── */
    .card-wrap { width: 540px; height: 540px; flex-shrink: 0; }

    .card {
      width: 1080px; height: 1080px;
      transform: scale(0.5); transform-origin: top left;
      background: var(--cream);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .card-header {
      padding: 52px 72px 36px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2px solid var(--border);
      flex-shrink: 0;
    }
    .card-logo { font-family: var(--font-serif); font-size: 2rem; font-weight: 700; color: var(--ink); }
    .card-date { font-size: 1.2rem; color: var(--ink-light); }

    .card-body { flex: 1; padding: 52px 72px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }

    .card-eyebrow {
      font-size: 1rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--accent);
    }

    .card-q-row {
      display: flex; flex-direction: column; gap: 10px;
    }

    .card-q-item {
      display: flex; align-items: flex-start; gap: 20px;
      background: white; border: 1.5px solid var(--border);
      border-radius: 14px; padding: 20px 24px;
    }

    .card-q-num {
      font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700;
      color: var(--accent); min-width: 32px; flex-shrink: 0; line-height: 1.3;
    }

    .card-q-content { flex: 1; }

    .card-q-text {
      font-family: var(--font-serif); font-size: 1.4rem; line-height: 1.35;
      color: var(--ink); margin-bottom: 12px;
    }

    .card-q-bar-row {
      display: flex; align-items: center; gap: 14px;
    }

    .card-q-bar-wrap {
      flex: 1; height: 10px; background: var(--border); border-radius: 6px; overflow: hidden;
    }

    .card-q-bar-fill {
      height: 100%; border-radius: 6px; background: var(--correct);
    }

    .card-q-pct {
      font-size: 1.25rem; font-weight: 600; color: var(--correct);
      min-width: 60px; text-align: right;
    }

    .card-footer {
      border-top: 2px solid var(--border);
      padding: 30px 72px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }

    .card-cta-label { font-size: 1.1rem; color: var(--ink-light); margin-bottom: 4px; }
    .card-cta-url { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; color: var(--ink); }

    .card-footer-tag {
      font-size: 1.1rem; color: var(--ink-light); text-align: right; line-height: 1.5;
    }

    @media print {
      body { background: none; padding: 0; margin: 0; display: block; }
      .controls { display: none; }
      #gate { display: none; }
      .card-wrap { width: 1080px; height: 1080px; }
      .card { transform: none; width: 1080px; height: 1080px; }
    }
  </style>
</head>
<body>

  <div id="gate">
    <h2>Pub Quiz Daily</h2>
    <p>Admin area — enter password to continue</p>
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()" />
    <button onclick="checkPw()">Continue</button>
    <div id="gate-error">Incorrect password</div>
  </div>

  <div id="main">
    <div class="controls">
      <h2>Instagram post builder</h2>
      <div class="fetch-row">
        <button class="btn-fetch" id="fetchBtn" onclick="fetchYesterday()">⟳ Load yesterday's data</button>
        <span id="fetch-status">Not loaded yet</span>
      </div>
      <div class="field">
        <label>Date label</label>
        <input id="dateLabel" value="" oninput="update()" />
      </div>
      <div class="btn-row">
        <button class="btn-export" id="exportBtn" onclick="exportJpg()">⬇ Export JPG for Instagram</button>
        <button class="btn-print" onclick="window.print()">Print / Save as PDF</button>
      </div>
      <p class="hint" id="export-hint">1080×1080px JPG — ready to upload to Instagram or Twitter</p>
    </div>

    <!-- The card -->
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="card-header">
          <span class="card-logo">Pub Quiz Daily</span>
          <span class="card-date" id="out-date">—</span>
        </div>
        <div class="card-body">
          <div class="card-eyebrow">Yesterday's questions</div>
          <div class="card-q-row" id="out-questions">
            <div style="color:#6b6b6b;font-size:1.4rem;">Load data to begin…</div>
          </div>
        </div>
        <div class="card-footer">
          <div>
            <div class="card-cta-label">Play today's questions at</div>
            <div class="card-cta-url">pubquizdaily.com</div>
          </div>
          <div class="card-footer-tag">How did<br>you do?</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script data-cfasync="false">
    const PAGE_PASSWORD = 'pqd-admin-2026';

    let loadedQuestions = [];
    let loadedStats = [];

    function checkPw() {
      const val = document.getElementById('pw-input').value;
      if (val === PAGE_PASSWORD) {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('main').style.display = 'flex';
      } else {
        document.getElementById('gate-error').style.display = 'block';
        document.getElementById('pw-input').value = '';
        document.getElementById('pw-input').focus();
      }
    }

    function yesterdayISO() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      return d.toISOString().slice(0, 10);
    }

    function formatDateLabel(iso) {
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    async function fetchYesterday() {
      const btn = document.getElementById('fetchBtn');
      const status = document.getElementById('fetch-status');
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Loading…';

      const date = yesterdayISO();

      try {
        const qRes = await fetch(`/.netlify/functions/question?date=${date}`);
        if (!qRes.ok) throw new Error(`Question fetch failed (${qRes.status})`);
        const qData = await qRes.json();
        loadedQuestions = qData.questions || [];

        // Fetch stats for each question
        loadedStats = await Promise.all(
          loadedQuestions.map((q, i) =>
            fetch(`/.netlify/functions/record-answer?date=${date}&index=${i}`)
              .then(r => r.ok ? r.json() : { total: 0, correctCount: 0 })
              .catch(() => ({ total: 0, correctCount: 0 }))
          )
        );

        document.getElementById('dateLabel').value = formatDateLabel(date);

        const totalPlayers = loadedStats.length > 0 ? Math.max(...loadedStats.map(s => s.total)) : 0;
        status.className = 'ok';
        status.textContent = `Loaded ✓ (${totalPlayers} player${totalPlayers !== 1 ? 's' : ''}, ${loadedQuestions.length} questions)`;

        update();

      } catch (err) {
        console.error(err);
        status.className = 'err';
        status.textContent = 'Error — see console';
      }

      btn.disabled = false;
    }

    function update() {
      document.getElementById('out-date').textContent = document.getElementById('dateLabel').value;

      const container = document.getElementById('out-questions');
      const eyebrow = document.querySelector('.card-eyebrow');
      const cardFooterTag = document.querySelector('.card-footer-tag');

      if (loadedQuestions.length === 0) {
        container.innerHTML = '<div style="color:#6b6b6b;font-size:1.4rem;">Load data to begin…</div>';
        return;
      }

      // Check for a picture question — use first one found
      const picQ = loadedQuestions.find(q => q.image);
      const picIdx = picQ ? loadedQuestions.indexOf(picQ) : -1;

      if (picQ) {
        // ── Picture question card ──
        const s = loadedStats[picIdx] || { total: 0, correctCount: 0 };
        const pct = s.total > 0 ? Math.round((s.correctCount / s.total) * 100) : 0;
        const imgUrl = `/.netlify/images?url=/pictures/${encodeURIComponent(picQ.image)}&w=936&fit=cover`;

        eyebrow.textContent = 'Picture round';
        cardFooterTag.innerHTML = `${pct}% got<br>this right`;

        container.innerHTML = `
          <img src="${imgUrl}" alt="${picQ.question}"
            style="width:100%;border-radius:14px;object-fit:cover;max-height:380px;display:block;" />
          <div style="font-family:var(--font-serif);font-size:2rem;line-height:1.35;color:var(--ink);margin-top:4px;">
            ${picQ.question}
          </div>
          <div style="display:flex;align-items:center;gap:20px;margin-top:8px;">
            <div style="flex:1;height:14px;background:var(--border);border-radius:8px;overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:var(--correct);border-radius:8px;"></div>
            </div>
            <span style="font-size:1.6rem;font-weight:600;color:var(--correct);min-width:80px;text-align:right;">${pct}% correct</span>
          </div>
        `;
      } else {
        // ── Multi-question results card ──
        eyebrow.textContent = 'Yesterday\'s questions';
        cardFooterTag.innerHTML = 'How did<br>you do?';

        container.innerHTML = loadedQuestions.map((q, i) => {
          const s = loadedStats[i] || { total: 0, correctCount: 0 };
          const pct = s.total > 0 ? Math.round((s.correctCount / s.total) * 100) : 0;
          return `
            <div class="card-q-item">
              <span class="card-q-num">Q${i + 1}</span>
              <div class="card-q-content">
                <div class="card-q-text">${q.question}</div>
                <div class="card-q-bar-row">
                  <div class="card-q-bar-wrap">
                    <div class="card-q-bar-fill" style="width:${pct}%"></div>
                  </div>
                  <span class="card-q-pct">${pct}% correct</span>
                </div>
              </div>
            </div>
          `;
        }).join('');
      }
    }

    async function exportJpg() {
      const btn = document.getElementById('exportBtn');
      const hint = document.getElementById('export-hint');
      btn.disabled = true;
      btn.textContent = 'Rendering…';

      try {
        const card = document.getElementById('card');
        card.style.transform = 'none';
        card.style.width = '1080px';
        card.style.height = '1080px';

        const canvas = await html2canvas(card, {
          width: 1080, height: 1080, scale: 1,
          useCORS: true, backgroundColor: '#faf9f7', logging: false,
        });

        card.style.transform = '';
        card.style.width = '';
        card.style.height = '';

        const date = yesterdayISO();
        const link = document.createElement('a');
        link.download = `pubquizdaily-${date}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.95);
        link.click();

        hint.textContent = `Downloaded pubquizdaily-${date}.jpg ✓`;
        hint.style.color = 'var(--correct)';

      } catch (err) {
        console.error(err);
        hint.textContent = 'Export failed — see console';
        hint.style.color = '#c0392b';
        const card = document.getElementById('card');
        card.style.transform = '';
        card.style.width = '';
        card.style.height = '';
      }

      btn.disabled = false;
      btn.textContent = '⬇ Export JPG for Instagram';
    }
  </script>
</body>
</html>

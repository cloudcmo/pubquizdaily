[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."daily-report"]
  schedule = "0 5 * * *"

# Weekly Best-of — DST-proof. Each fires at two UTC times; the function only
# proceeds at the correct Europe/London hour, so it stays 18:30 / 06:30 UK
# whether it's BST or GMT.
[functions."weekly-preview"]
  schedule = "30 17,18 * * 4"

[functions."weekly-broadcast"]
  schedule = "30 5,6 * * 5"

# Safety net: if the 06:30 send was missed (e.g. Netlify skipped the cron
# invocation, as on 2026-08-07), this sends it at ~08:00 UK and emails the
# admin. Does nothing on a healthy Friday.
[functions."weekly-watchdog"]
  schedule = "0 7,8 * * 5"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Pub Quiz Daily</title>
  <meta name="description" content="Play a past week of Pub Quiz Daily and see how you score." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf9f7; --ink: #1a1a1a; --ink-light: #6b6b6b; --ink-faint: #c8c8c8;
      --border: #e0ddd8; --correct: #4a7c59; --correct-bg: #edf4ef;
      --wrong: #3d6b8c; --wrong-bg: #eaf1f7;
      --font-serif: 'Libre Baskerville', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    body { background: var(--cream); color: var(--ink); font-family: var(--font-sans); min-height: 100dvh; display: flex; flex-direction: column; }

    header { border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; flex-shrink: 0; position: relative; }
    .logo { font-family: var(--font-serif); font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
    .burger { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; z-index: 200; }
    .burger span { display: block; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; transition: all 0.2s; }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-menu { display: none; position: absolute; top: 56px; right: 0; left: 0; background: white; border-bottom: 1px solid var(--border); z-index: 100; padding: 8px 0; }
    .nav-menu.open { display: block; }
    .nav-menu a { display: block; padding: 12px 24px; font-size: 0.9375rem; font-weight: 500; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--border); }
    .nav-menu a:last-child { border-bottom: none; }
    .nav-menu a:hover { background: var(--cream); }
    .nav-menu a.active { color: var(--correct); }

    main { flex: 1; max-width: 560px; margin: 0 auto; width: 100%; padding: 32px 24px 60px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--ink-light); text-decoration: none; margin-bottom: 20px; }
    .back-link:hover { color: var(--ink); }

    .page-header { margin-bottom: 28px; }
    .week-label { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 8px; }
    .page-title { font-family: var(--font-serif); font-size: 1.625rem; margin-bottom: 8px; }
    .page-subtitle { font-size: 0.9375rem; color: var(--ink-light); }

    .score-bar { display: flex; align-items: center; gap: 12px; background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 28px; position: sticky; top: 12px; z-index: 10; }
    .score-pips { display: flex; gap: 5px; flex-wrap: wrap; }
    .pip { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background 0.2s; }
    .pip.correct { background: var(--correct); }
    .pip.wrong { background: var(--wrong); }
    .score-label { font-size: 0.875rem; color: var(--ink-light); margin-left: auto; }
    .score-number { font-weight: 600; color: var(--ink); }

    .questions { display: flex; flex-direction: column; gap: 16px; }

    .question-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 20px; transition: border-color 0.2s; }
    .question-card.answered-correct { border-color: var(--correct); }
    .question-card.answered-wrong { border-color: var(--wrong); }

    .q-meta { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
    .q-image { width: 100%; border-radius: 8px; margin-bottom: 14px; display: block; max-height: 260px; object-fit: cover; }
    .q-text { font-family: var(--font-serif); font-size: 1.0625rem; line-height: 1.5; margin-bottom: 14px; }

    .options { display: flex; flex-direction: column; gap: 7px; }
    .option-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; background: var(--cream); border: 1px solid var(--border); border-radius: 7px; cursor: pointer; text-align: left; font-family: var(--font-sans); font-size: 0.875rem; color: var(--ink); transition: border-color 0.1s, background 0.1s; -webkit-tap-highlight-color: transparent; }
    .option-btn:hover:not(:disabled) { border-color: var(--ink); }
    .option-btn:disabled { cursor: default; }

    .option-letter { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border); font-size: 0.6875rem; font-weight: 600; flex-shrink: 0; color: var(--ink-light); transition: background 0.1s, border-color 0.1s, color 0.1s; }

    .option-btn.correct { background: var(--correct-bg); border-color: var(--correct); }
    .option-btn.correct .option-letter { background: var(--correct); border-color: var(--correct); color: white; }
    .option-btn.correct .option-letter::after { content: '✓'; }
    .option-btn.correct .option-text { color: var(--correct); font-weight: 500; }
    .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
    .option-btn.wrong .option-letter { background: var(--wrong); border-color: var(--wrong); color: white; }
    .option-btn.wrong .option-letter::after { content: '✗'; }
    .option-btn.wrong .option-text { color: var(--wrong); }
    .option-btn.correct .option-letter,
    .option-btn.wrong .option-letter { font-size: 0; }
    .option-btn.correct .option-letter::after,
    .option-btn.wrong .option-letter::after { font-size: 0.6875rem; }
    .option-btn.muted { opacity: 0.38; }

    .explainer { margin-top: 10px; font-size: 0.8125rem; color: var(--ink-light); line-height: 1.5; display: none; padding-top: 10px; border-top: 1px solid var(--border); }
    .explainer.visible { display: block; }

    .stats-text { display: none; margin-top: 8px; font-size: 0.8125rem; font-weight: 500; color: var(--ink-light); background: white; border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; text-align: center; }
    .stats-text.visible { display: inline-block; }

    .final-panel { margin-top: 32px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px; text-align: center; display: none; }
    .final-panel.visible { display: block; }
    .final-score { font-family: var(--font-serif); font-size: 3rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .final-out-of { font-size: 0.875rem; color: var(--ink-light); margin-bottom: 16px; }
    .final-message { font-family: var(--font-serif); font-style: italic; font-size: 1.125rem; margin-bottom: 20px; }
    .share-nudge { font-family: var(--font-serif); font-style: italic; font-size: 1rem; color: var(--ink); margin-bottom: 14px; }
    .share-sub { margin-top: 10px; font-size: 0.8125rem; color: var(--ink-faint); }
    .share-btn { display: inline-flex; align-items: center; gap: 10px; padding: 13px 28px; background: #2d6a4f; color: white; border: none; border-radius: 10px; font-family: var(--font-sans); font-size: 0.9375rem; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .share-btn:hover { background: #1e4d38; }
    .archive-nudge { display: inline-block; margin-top: 16px; font-size: 0.8125rem; color: var(--ink-light); text-decoration: none; }
    .archive-nudge:hover { color: var(--ink); }

    .loading { text-align: center; padding: 48px 0; color: var(--ink-light); font-size: 0.875rem; }
    .loading-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); animation: dot-pulse 1.2s ease-in-out infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--ink-light); font-size: 0.9rem; line-height: 1.6; }

    footer { border-top: 1px solid var(--border); text-align: center; padding: 16px 24px; font-size: 0.75rem; color: var(--ink-faint); }
    footer a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">Pub Quiz Daily</a>
    <button class="burger" id="burgerBtn" aria-label="Menu" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu" id="navMenu">
      <a href="/">Today's questions</a>
      <a href="/weekly.html">Weekly Best-of</a>
      <a href="/archive.html" class="active">Archive</a>
      <a href="/articles.html">Articles</a>
      <a href="/subscribe.html">Friday email</a>
      <a href="https://tomcobleypubquiz.co.uk" target="_blank" rel="noopener">Tom Cobley quiz ↗</a>
    </nav>
  </header>

  <main>
    <a class="back-link" href="/archive.html">← Back to the archive</a>

    <div class="page-header">
      <p class="week-label" id="weekLabel">Archive</p>
      <h1 class="page-title">Play this week.</h1>
      <p class="page-subtitle">Hand-picked questions from the archive.</p>
    </div>

    <div id="app">
      <div class="loading">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        Loading this week's questions…
      </div>
    </div>
  </main>

  <footer>Fresh questions. Every day. &nbsp;·&nbsp; Pub Quiz Daily &nbsp;·&nbsp; <a href="/cdn-cgi/l/email-protection">Send feedback</a></footer>

  <script data-cfasync="false">
    function imageUrl(val) {
      if (!val) return null;
      if (val.startsWith('http')) {
        return val.replace(/[?&]dl=0$/, match => match[0] + 'raw=1').replace('www.dropbox.com', 'dl.dropboxusercontent.com');
      }
      return `/.netlify/images?url=/pictures/${encodeURIComponent(val)}&w=600&fit=cover`;
    }
    const LETTERS = ['A', 'B', 'C', 'D'];

    function scoreMessage(score, total) {
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;
      if (score === 0)     return "Zero out of the lot — were you even trying? 😄";
      if (score === total) return "Full marks — pub quiz royalty. 👑";
      if (pct >= 80)      return `${score}/${total} — outstanding effort.`;
      if (pct >= 60)      return `${score}/${total} — solid pub quizzer.`;
      if (pct >= 40)      return `${score}/${total} — respectable. Room to grow.`;
      return `${score}/${total} — better luck next time.`;
    }

    const weekParam = new URLSearchParams(location.search).get('week');
    let questions = [];
    let answered  = {};
    let score     = 0;
    let weekStart = null;
    let weekEnd   = null;

    async function loadWeek() {
      if (!weekParam) { showEmpty(); return; }
      try {
        const res = await fetch(`/.netlify/functions/archive?week=${encodeURIComponent(weekParam)}`);
        if (!res.ok) throw new Error('no questions for this week');
        const data = await res.json();
        questions = data.questions || [];
        weekStart = data.weekStart;
        weekEnd = data.weekEnd;
        if (questions.length === 0) throw new Error('empty');

        const opts = { day: 'numeric', month: 'long' };
        const start = new Date(weekStart + 'T12:00:00');
        const end = new Date(weekEnd + 'T12:00:00');
        const rangeText = `${start.toLocaleDateString('en-GB', opts)} – ${end.toLocaleDateString('en-GB', opts)}`;
        document.getElementById('weekLabel').textContent = `Archive · ${rangeText}`;
        document.title = `Week of ${rangeText} — Pub Quiz Daily Archive`;

        renderAll();
      } catch (err) {
        console.error(err);
        showEmpty();
      }
    }

    function showEmpty() {
      document.getElementById('app').innerHTML =
        '<div class="empty-state">Couldn\'t find that week. <a href="/archive.html">Head back to the archive</a> and pick another.</div>';
    }

    function formatDateShort(iso) {
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function renderAll() {
      const app = document.getElementById('app');
      const pips = questions.map((_, i) => `<span class="pip" id="pip-${i}"></span>`).join('');

      app.innerHTML = `
        <div class="score-bar">
          <div class="score-pips">${pips}</div>
          <span class="score-label"><span class="score-number" id="scoreNum">0</span> / ${questions.length}</span>
        </div>
        <div class="questions" id="questionsList"></div>
        <div class="final-panel" id="finalPanel">
          <div class="final-score" id="finalScore">0</div>
          <div class="final-out-of">out of ${questions.length}</div>
          <div class="final-message" id="finalMessage"></div>
          <p class="share-nudge">Beat your mates? Prove it.</p>
          <button class="share-btn" onclick="shareResult()">
            Share my score
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          </button>
          <p class="share-sub">Sharing includes your score and a link — no spoilers.</p>
          <a class="archive-nudge" href="/archive.html">📚 Play another week →</a>
        </div>
      `;

      const list = document.getElementById('questionsList');
      questions.forEach((q, i) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${i}`;

        const optionsHtml = q.options.map((text, oi) => `
          <button class="option-btn" data-qi="${i}" data-letter="${LETTERS[oi]}" onclick="handleAnswer(${i}, '${LETTERS[oi]}')">
            <span class="option-letter">${LETTERS[oi]}</span>
            <span class="option-text">${text}</span>
          </button>
        `).join('');

        card.innerHTML = `
          <div class="q-meta">Q${i + 1} · ${formatDateShort(q.date)}</div>
          ${q.image ? `<img class="q-image" src="${imageUrl(q.image)}" alt="${q.question}" onerror="this.remove()" />` : ''}
          <div class="q-text">${q.question}</div>
          <div class="options">${optionsHtml}</div>
          ${q.explainer ? `<div class="explainer" id="explainer-${i}">${q.explainer}</div>` : ''}
          <div class="stats-text" id="stats-${i}"></div>
        `;
        list.appendChild(card);
      });
    }

    function handleAnswer(qi, chosen) {
      if (answered[qi] !== undefined) return;

      const q = questions[qi];
      const isCorrect = chosen === q.correct;
      answered[qi] = isCorrect ? 'correct' : 'wrong';
      if (isCorrect) score++;

      const card = document.getElementById(`card-${qi}`);
      card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

      card.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
        const l = btn.dataset.letter;
        if (l === q.correct) btn.classList.add('correct');
        else if (l === chosen && !isCorrect) btn.classList.add('wrong');
        else btn.classList.add('muted');
      });

      const exp = document.getElementById(`explainer-${qi}`);
      if (exp) exp.classList.add('visible');

      const pip = document.getElementById(`pip-${qi}`);
      if (pip) pip.classList.add(isCorrect ? 'correct' : 'wrong');

      document.getElementById('scoreNum').textContent = score;

      fetchStat(qi, q.date, q.index, isCorrect);

      if (Object.keys(answered).length === questions.length) showFinal();
    }

    function showFinal() {
      const panel = document.getElementById('finalPanel');
      document.getElementById('finalScore').textContent = score;
      document.getElementById('finalMessage').textContent = scoreMessage(score, questions.length);
      panel.classList.add('visible');
      setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
    }

    async function fetchStat(qi, date, index, isCorrect) {
      try {
        const res = await fetch(`/.netlify/functions/record-answer?date=${date}&index=${index}`);
        if (!res.ok) return;
        const { total, correctCount } = await res.json();
        if (!total || total < 2) return;
        const pct = Math.round((correctCount / total) * 100);
        const el = document.getElementById(`stats-${qi}`);
        if (!el) return;
        el.textContent = isCorrect
          ? (pct >= 70 ? `Most people got this — ${pct}% answered correctly` : `${pct}% of players got this right`)
          : (pct >= 70 ? `Tricky — ${100 - pct}% also got this wrong` : `${pct}% of players got this right`);
        el.classList.add('visible');
      } catch {}
    }

    // Sharing a score from a past week should never drop a new visitor
    // into that specific archived week — link back to the home page so
    // they land on today's live quiz instead.
    function shareResult() {
      fetch('/.netlify/functions/record-share', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'archive', date: weekStart || new Date().toISOString().slice(0, 10) }),
      }).catch(() => {});

      const emojiRow = questions.map((_, i) => answered[i] === 'correct' ? '🟢' : '🔴').join('');
      const total = questions.length;
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;

      let taunt;
      if (score === total)  taunt = `Full marks on a Pub Quiz Daily archive round. Can you match it?`;
      else if (pct >= 80)   taunt = `${score}/${total} on a Pub Quiz Daily archive round. Reckon you can do better?`;
      else if (pct >= 60)   taunt = `${score}/${total}. The bar is set.`;
      else if (score === 0) taunt = `0/${total}. A heroic performance in wrongness. Your go.`;
      else                  taunt = `${score}/${total}. Room at the top.`;

      const text = `🍺 Pub Quiz Daily\n\n${emojiRow}\n\n${taunt}\npubquizdaily.com`;

      if (navigator.share) {
        navigator.share({ title: 'Pub Quiz Daily', text }).catch(() => {});
      } else {
        navigator.clipboard.writeText(text).then(() => {
          const btn = document.querySelector('.share-btn');
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.innerHTML = 'Share my score <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>'; }, 2000);
        });
      }
    }

    function toggleMenu() {
      document.getElementById('burgerBtn').classList.toggle('open');
      document.getElementById('navMenu').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('header')) {
        document.getElementById('burgerBtn').classList.remove('open');
        document.getElementById('navMenu').classList.remove('open');
      }
    });

    loadWeek();
  </script>
</body>
</html>

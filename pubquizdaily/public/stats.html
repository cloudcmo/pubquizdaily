
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stats — Pub Quiz Daily</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf9f7;
      --ink: #1a1a1a;
      --ink-light: #6b6b6b;
      --ink-faint: #c8c8c8;
      --border: #e0ddd8;
      --correct: #4a7c59;
      --correct-bg: #edf4ef;
      --wrong: #c0622e;
      --wrong-bg: #fdf0eb;
      --font-serif: 'Libre Baskerville', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: var(--font-sans);
      min-height: 100dvh;
      padding: 40px 24px;
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--ink-light);
      margin-bottom: 32px;
    }

    /* Login form */
    .login-form {
      display: flex;
      gap: 8px;
      max-width: 340px;
      margin-top: 24px;
    }

    .login-input {
      flex: 1;
      padding: 10px 14px;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      outline: none;
    }

    .login-input:focus { border-color: var(--ink); }

    .login-btn {
      padding: 10px 20px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
    }

    .login-btn:hover { opacity: 0.8; }

    .error-msg {
      color: var(--wrong);
      font-size: 0.875rem;
      margin-top: 8px;
      display: none;
    }

    /* Summary cards */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .card-value {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1;
      margin-bottom: 4px;
    }

    .card-label {
      font-size: 0.75rem;
      color: var(--ink-light);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-light);
      border-bottom: 2px solid var(--border);
    }

    th:last-child, td:last-child { text-align: right; }

    td {
      padding: 12px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    .bar-cell { width: 40%; }

    .bar-wrap {
      background: var(--border);
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      background: var(--correct);
      transition: width 0.4s ease;
    }

    .bar-fill.low { background: var(--wrong); }
    .bar-fill.mid { background: #c08030; }

    .pct {
      font-weight: 600;
      font-size: 0.9375rem;
    }

    .pct.high { color: var(--correct); }
    .pct.mid { color: #c08030; }
    .pct.low { color: var(--wrong); }

    .plays {
      color: var(--ink-light);
      font-size: 0.875rem;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 48px 0;
      color: var(--ink-light);
    }

    .loading-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
    .loading-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--ink-faint);
      animation: dot-pulse 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }


    .q-text {
      font-size: 0.8125rem;
      color: var(--ink-light);
      max-width: 260px;
      line-height: 1.4;
    }
    .back-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 0.875rem;
      color: var(--ink-light);
      text-decoration: none;
    }
    .back-link:hover { color: var(--ink); }

    /* ── Newsletter chart ── */
    .chart-section {
      margin-top: 40px;
      margin-bottom: 8px;
    }

    .chart-section h2 {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      margin-bottom: 4px;
    }

    .chart-section .subtitle {
      font-size: 0.8125rem;
      color: var(--ink-light);
      margin-bottom: 20px;
    }

    .chart-wrap {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px 20px;
    }

    .chart-title {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      color: var(--ink);
    }

    .chart-subtitle {
      font-size: 0.75rem;
      text-align: center;
      color: var(--ink-light);
      margin-bottom: 24px;
      letter-spacing: 0.03em;
    }

    .save-btn {
      margin-top: 16px;
      padding: 9px 20px;
      background: var(--ink);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .save-btn:hover { opacity: 0.8; }
  </style>
</head>
<body>

  <!-- Login screen -->
  <div id="loginScreen">
    <h1>Pub Quiz Daily</h1>
    <p class="subtitle">Stats dashboard — private</p>
    <div class="login-form">
      <input class="login-input" type="password" id="passwordInput" placeholder="Password" />
      <button class="login-btn" onclick="login()">View stats</button>
    </div>
    <p class="error-msg" id="errorMsg">Wrong password</p>
  </div>

  <!-- Stats screen -->
  <div id="statsScreen" style="display:none">
    <h1>Pub Quiz Daily</h1>
    <p class="subtitle" id="statsSubtitle">Loading stats…</p>

    <div id="loadingState" class="loading">
      <div class="loading-dots"><span></span><span></span><span></span></div>
      Fetching data…
    </div>

    <div id="statsContent" style="display:none">
      <div class="summary" id="summaryCards"></div>
      <table id="statsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Question</th>
            <th>Plays</th>
            <th class="bar-cell">% Correct</th>
            <th>Score</th>
          </tr>
        </thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>

    <div class="chart-section" id="chartSection" style="display:none">
      <h2>Newsletter chart</h2>
      <p class="subtitle">This week's daily scores — save and drop into your Friday email.</p>
      <div class="chart-wrap" id="chartWrap">
        <div class="chart-title">Pub Quiz Daily - how many got it right?</div>
        <div class="chart-subtitle" id="chartDateRange"></div>
        <div id="barChart"></div>
      </div>
      <button class="save-btn" onclick="saveChart()">Save chart as JPG</button>
    </div>

    <a class="back-link" href="/">← Back to site</a>
  </div>

  <script>
    let currentPassword = '';

    // Check if password stored in session
    const saved = sessionStorage.getItem('stats_pw');
    if (saved) {
      currentPassword = saved;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('statsScreen').style.display = 'block';
      loadStats();
    }

    // Allow Enter key on password field
    document.getElementById('passwordInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });

    function login() {
      const pw = document.getElementById('passwordInput').value.trim();
      if (!pw) return;
      currentPassword = pw;
      sessionStorage.setItem('stats_pw', pw);
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('statsScreen').style.display = 'block';
      loadStats();
    }

    async function loadStats() {
      try {
        const res = await fetch(`/.netlify/functions/stats?password=${encodeURIComponent(currentPassword)}`);

        if (res.status === 401) {
          sessionStorage.removeItem('stats_pw');
          document.getElementById('statsScreen').style.display = 'none';
          document.getElementById('loginScreen').style.display = 'block';
          document.getElementById('errorMsg').style.display = 'block';
          return;
        }

        const data = await res.json();
        renderStats(data.stats || []);

      } catch (e) {
        document.getElementById('loadingState').textContent = 'Failed to load stats.';
      }
    }

    async function renderStats(stats) {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('statsContent').style.display = 'block';

      const totalPlays = stats.reduce((s, r) => s + r.total, 0);
      const totalCorrect = stats.reduce((s, r) => s + r.correctCount, 0);
      const avgPct = totalPlays > 0 ? Math.round((totalCorrect / totalPlays) * 100) : 0;
      const activeDays = stats.filter(r => r.total > 0).length;

      document.getElementById('statsSubtitle').textContent =
        `${activeDays} day${activeDays !== 1 ? 's' : ''} of data`;

      // Summary cards
      document.getElementById('summaryCards').innerHTML = `
        <div class="card">
          <div class="card-value">${totalPlays.toLocaleString()}</div>
          <div class="card-label">Total plays</div>
        </div>
        <div class="card">
          <div class="card-value">${activeDays}</div>
          <div class="card-label">Active days</div>
        </div>
        <div class="card">
          <div class="card-value">${avgPct}%</div>
          <div class="card-label">Avg correct</div>
        </div>
      `;

      // Fetch question text for each date
      const questions = await Promise.all(
        stats.map(row =>
          fetch(`/.netlify/functions/question?date=${row.date}&password=${encodeURIComponent(currentPassword)}`)
            .then(r => r.ok ? r.json() : null)
            .catch(() => null)
        )
      );

      // Render newsletter chart
      renderChart(stats, questions);

      // Table rows
      const tbody = document.getElementById('statsBody');
      tbody.innerHTML = stats.map((row, i) => {
        const pct = row.total > 0 ? Math.round((row.correctCount / row.total) * 100) : 0;
        const tier = pct >= 60 ? 'high' : pct >= 40 ? 'mid' : 'low';
        const d = new Date(row.date + 'T12:00:00');
        const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        const qText = questions[i]?.question || '—';
        return `
          <tr>
            <td>${dateStr}</td>
            <td class="q-text">${qText}</td>
            <td class="plays">${row.total}</td>
            <td class="bar-cell">
              <div class="bar-wrap">
                <div class="bar-fill ${tier}" style="width:${pct}%"></div>
              </div>
            </td>
            <td class="pct ${tier}">${row.total > 0 ? pct + '%' : '—'}</td>
          </tr>
        `;
      }).join('');
    }

    function renderChart(stats, questions) {
      // Get last 7 days (Sat to Fri or most recent 7 with data)
      const chartData = stats
        .filter(r => r.total > 0)
        .slice(0, 7)
        .reverse(); // oldest first for chart

      if (chartData.length === 0) return;

      document.getElementById('chartSection').style.display = 'block';

      // Date range label
      const oldest = new Date(chartData[0].date + 'T12:00:00');
      const newest = new Date(chartData[chartData.length - 1].date + 'T12:00:00');
      const fmt = { day: 'numeric', month: 'long' };
      document.getElementById('chartDateRange').textContent =
        `${oldest.toLocaleDateString('en-GB', fmt)} – ${newest.toLocaleDateString('en-GB', fmt)}`;

      const barW = 56;
      const gap = 16;
      const chartH = 180;
      const labelH = 48;
      const topPad = 32;
      const totalW = chartData.length * (barW + gap) - gap;
      const svgW = totalW + 40;
      const svgH = chartH + labelH + topPad;

      const colors = ['#4a7c59','#4a7c59','#4a7c59','#4a7c59','#4a7c59','#4a7c59','#4a7c59'];

      const bars = chartData.map((row, i) => {
        const pct = Math.round((row.correctCount / row.total) * 100);
        const barH = Math.max(8, Math.round((pct / 100) * chartH));
        const x = 20 + i * (barW + gap);
        const y = topPad + chartH - barH;
        const d = new Date(row.date + 'T12:00:00');
        const dayLabel = d.toLocaleDateString('en-GB', { weekday: 'short' });
        const dateLabel = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
        const labelY = topPad + chartH + 16;
        const color = colors[i % colors.length];

        return `
          <rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="5" fill="${color}" opacity="0.85"/>
          <text x="${x + barW/2}" y="${y - 7}" text-anchor="middle"
            font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">${pct}%</text>
          <text x="${x + barW/2}" y="${labelY}" text-anchor="middle"
            font-family="DM Sans, sans-serif" font-size="11" font-weight="600" fill="#6b6b6b">${dayLabel}</text>
          <text x="${x + barW/2}" y="${labelY + 14}" text-anchor="middle"
            font-family="DM Sans, sans-serif" font-size="10" fill="#c8c8c8">${dateLabel}</text>
        `;
      }).join('');

      // Subtle grid lines at 25%, 50%, 75%
      const gridLines = [25, 50, 75].map(pct => {
        const y = topPad + chartH - Math.round((pct / 100) * chartH);
        return `<line x1="20" y1="${y}" x2="${svgW - 20}" y2="${y}"
          stroke="#e0ddd8" stroke-width="1" stroke-dasharray="3 3"/>
          <text x="16" y="${y + 4}" text-anchor="end"
            font-family="DM Sans, sans-serif" font-size="9" fill="#c8c8c8">${pct}%</text>`;
      }).join('');

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 ${svgW} ${svgH}" id="chartSvg">
        ${gridLines}
        ${bars}
      </svg>`;

      document.getElementById('barChart').innerHTML = svg;
    }

    function saveChart() {
      const svg = document.getElementById('chartSvg');
      if (!svg) return;

      const vb = svg.getAttribute('viewBox').split(' ').map(Number);
      const scale = 2; // retina quality
      const w = vb[2] * scale;
      const h = vb[3] * scale;

      // Clone SVG and add cream background
      const clone = svg.cloneNode(true);
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', 0); bg.setAttribute('y', 0);
      bg.setAttribute('width', vb[2]); bg.setAttribute('height', vb[3]);
      bg.setAttribute('fill', '#faf9f7');
      clone.insertBefore(bg, clone.firstChild);
      clone.setAttribute('width', vb[2]);
      clone.setAttribute('height', vb[3]);

      const svgStr = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#faf9f7';
        ctx.fillRect(0, 0, w, h);
        ctx.scale(scale, scale);
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        canvas.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'pubquizdaily-weekly-chart.jpg';
          a.click();
        }, 'image/jpeg', 0.95);
      };
      img.src = url;
    }
  </script>
</body>
</html>

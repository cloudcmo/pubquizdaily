<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — Pub Quiz Daily</title>
  <meta name="description" content="Every week of Pub Quiz Daily, all in one place. Browse past weekly round-ups and play any of them." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://pubquizdaily.com/archive.html" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #faf9f7; --ink: #1a1a1a; --ink-light: #6b6b6b; --ink-faint: #c8c8c8;
      --border: #e0ddd8; --correct: #4a7c59; --correct-bg: #edf4ef;
      --wrong: #3d6b8c; --wrong-bg: #eaf1f7;
      --font-serif: 'Libre Baskerville', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
    }

    body { background: var(--cream); color: var(--ink); font-family: var(--font-sans); min-height: 100dvh; display: flex; flex-direction: column; }

    header { border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; flex-shrink: 0; position: relative; }
    .logo { font-family: var(--font-serif); font-size: 1.125rem; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
    .burger { background: none; border: none; cursor: pointer; padding: 8px; display: flex; flex-direction: column; gap: 5px; z-index: 200; }
    .burger span { display: block; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; transition: all 0.2s; }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-menu { display: none; position: absolute; top: 56px; right: 0; left: 0; background: white; border-bottom: 1px solid var(--border); z-index: 100; padding: 8px 0; }
    .nav-menu.open { display: block; }
    .nav-menu a { display: block; padding: 12px 24px; font-size: 0.9375rem; font-weight: 500; color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--border); }
    .nav-menu a:last-child { border-bottom: none; }
    .nav-menu a:hover { background: var(--cream); }
    .nav-menu a.active { color: var(--correct); }

    main { flex: 1; max-width: 560px; margin: 0 auto; width: 100%; padding: 40px 24px 60px; }

    .page-header { margin-bottom: 32px; }
    .page-title { font-family: var(--font-serif); font-size: 1.75rem; margin-bottom: 8px; }
    .page-subtitle { font-size: 0.9375rem; color: var(--ink-light); }

    .loading { text-align: center; padding: 48px 0; color: var(--ink-light); font-size: 0.875rem; }
    .loading-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); animation: dot-pulse 1.2s ease-in-out infinite; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-pulse { 0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

    .weeks { display: flex; flex-direction: column; gap: 10px; }

    .week-item { background: white; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .week-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; background: none; border: none; cursor: pointer; text-align: left; font-family: var(--font-sans); }
    .week-toggle-text { display: flex; flex-direction: column; gap: 3px; }
    .week-range { font-family: var(--font-serif); font-size: 1.0625rem; color: var(--ink); }
    .week-count { font-size: 0.75rem; color: var(--ink-light); }
    .week-chevron { flex-shrink: 0; transition: transform 0.2s; color: var(--ink-light); }
    .week-item.open .week-chevron { transform: rotate(180deg); }

    .week-panel { display: none; padding: 0 18px 18px; }
    .week-item.open .week-panel { display: block; }

    .questions { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }

    .question-card { background: var(--cream); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .question-card.answered-correct { border-color: var(--correct); }
    .question-card.answered-wrong { border-color: var(--wrong); }

    .q-meta { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
    .q-image { width: 100%; border-radius: 8px; margin-bottom: 12px; display: block; max-height: 220px; object-fit: cover; }
    .q-text { font-family: var(--font-serif); font-size: 1rem; line-height: 1.45; margin-bottom: 12px; }

    .options { display: flex; flex-direction: column; gap: 6px; }
    .option-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 13px; background: white; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; text-align: left; font-family: var(--font-sans); font-size: 0.8437rem; color: var(--ink); transition: border-color 0.1s, background 0.1s; -webkit-tap-highlight-color: transparent; }
    .option-btn:hover:not(:disabled) { border-color: var(--ink); }
    .option-btn:disabled { cursor: default; }

    .option-letter { display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border); font-size: 0.65rem; font-weight: 600; flex-shrink: 0; color: var(--ink-light); transition: background 0.1s, border-color 0.1s, color 0.1s; }

    .option-btn.correct { background: var(--correct-bg); border-color: var(--correct); }
    .option-btn.correct .option-letter { background: var(--correct); border-color: var(--correct); color: white; }
    .option-btn.correct .option-letter::after { content: '✓'; }
    .option-btn.correct .option-text { color: var(--correct); font-weight: 500; }
    .option-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
    .option-btn.wrong .option-letter { background: var(--wrong); border-color: var(--wrong); color: white; }
    .option-btn.wrong .option-letter::after { content: '✗'; }
    .option-btn.wrong .option-text { color: var(--wrong); }
    .option-btn.correct .option-letter,
    .option-btn.wrong .option-letter { font-size: 0; }
    .option-btn.correct .option-letter::after,
    .option-btn.wrong .option-letter::after { font-size: 0.65rem; }
    .option-btn.muted { opacity: 0.38; }

    .explainer { margin-top: 10px; font-size: 0.8rem; color: var(--ink-light); line-height: 1.5; display: none; padding-top: 10px; border-top: 1px solid var(--border); }
    .explainer.visible { display: block; }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--ink-light); font-size: 0.9rem; line-height: 1.6; }

    footer { border-top: 1px solid var(--border); text-align: center; padding: 16px 24px; font-size: 0.75rem; color: var(--ink-faint); }
    footer a { color: inherit; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="/">Pub Quiz Daily</a>
    <button class="burger" id="burgerBtn" aria-label="Menu" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-menu" id="navMenu">
      <a href="/">Today's questions</a>
      <a href="/weekly.html">Weekly Best-of</a>
      <a href="/archive.html" class="active">Archive</a>
      <a href="/articles.html">Articles</a>
      <a href="/subscribe.html">Friday email</a>
      <a href="https://tomcobleypubquiz.co.uk" target="_blank" rel="noopener">Tom Cobley quiz ↗</a>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1 class="page-title">The Archive.</h1>
      <p class="page-subtitle">Every week of Pub Quiz Daily, going back as far as we've got. Tap a week to open it up.</p>
    </div>

    <div id="app">
      <div class="loading">
        <div class="loading-dots"><span></span><span></span><span></span></div>
        Loading the archive…
      </div>
    </div>
  </main>

  <footer>Fresh questions. Every day. &nbsp;·&nbsp; Pub Quiz Daily &nbsp;·&nbsp; <a href="/cdn-cgi/l/email-protection">Send feedback</a></footer>

  <script data-cfasync="false">
    function imageUrl(val) {
      if (!val) return null;
      if (val.startsWith('http')) {
        return val.replace(/[?&]dl=0$/, match => match[0] + 'raw=1').replace('www.dropbox.com', 'dl.dropboxusercontent.com');
      }
      return `/.netlify/images?url=/pictures/${encodeURIComponent(val)}&w=600&fit=cover`;
    }
    const LETTERS = ['A', 'B', 'C', 'D'];

    let weeks = [];

    async function loadArchive() {
      try {
        const res = await fetch('/.netlify/functions/archive');
        if (!res.ok) throw new Error('no archive data');
        const data = await res.json();
        weeks = data.weeks || [];
        if (weeks.length === 0) throw new Error('empty');
        renderWeeks();
      } catch (err) {
        console.error(err);
        document.getElementById('app').innerHTML =
          '<div class="empty-state">No archived weeks yet — check back once a few weeks of questions have gone up.</div>';
      }
    }

    function formatRange(weekStart, weekEnd) {
      const opts = { day: 'numeric', month: 'long' };
      const start = new Date(weekStart + 'T12:00:00');
      const end = new Date(weekEnd + 'T12:00:00');
      return `${start.toLocaleDateString('en-GB', opts)} – ${end.toLocaleDateString('en-GB', opts)}`;
    }

    function renderWeeks() {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="weeks" id="weeksList"></div>`;
      const list = document.getElementById('weeksList');

      weeks.forEach((week, wi) => {
        const item = document.createElement('div');
        item.className = 'week-item';
        item.id = `week-${wi}`;
        item.innerHTML = `
          <button class="week-toggle" onclick="toggleWeek(${wi})">
            <span class="week-toggle-text">
              <span class="week-range">${formatRange(week.weekStart, week.weekEnd)}</span>
              <span class="week-count">${week.questions.length} question${week.questions.length === 1 ? '' : 's'}</span>
            </span>
            <svg class="week-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="week-panel">
            <div class="questions" id="questions-${wi}"></div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function toggleWeek(wi) {
      const item = document.getElementById(`week-${wi}`);
      const wasOpen = item.classList.contains('open');
      item.classList.toggle('open');

      // Render the questions the first time this week is opened.
      const container = document.getElementById(`questions-${wi}`);
      if (!wasOpen && !container.dataset.rendered) {
        container.dataset.rendered = '1';
        renderQuestions(wi, container);
      }
    }

    function renderQuestions(wi, container) {
      const week = weeks[wi];
      week.questions.forEach((q, qi) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${wi}-${qi}`;

        const optionsHtml = q.options.map((text, oi) => `
          <button class="option-btn" data-letter="${LETTERS[oi]}" onclick="handleAnswer(${wi}, ${qi}, '${LETTERS[oi]}')">
            <span class="option-letter">${LETTERS[oi]}</span>
            <span class="option-text">${text}</span>
          </button>
        `).join('');

        card.innerHTML = `
          <div class="q-meta">${formatDateShort(q.date)}</div>
          ${q.image ? `<img class="q-image" src="${imageUrl(q.image)}" alt="${q.question}" loading="lazy" onerror="this.remove()" />` : ''}
          <div class="q-text">${q.question}</div>
          <div class="options">${optionsHtml}</div>
          ${q.explainer ? `<div class="explainer" id="explainer-${wi}-${qi}">${q.explainer}</div>` : ''}
        `;
        container.appendChild(card);
      });
    }

    function formatDateShort(iso) {
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    }

    function handleAnswer(wi, qi, chosen) {
      const card = document.getElementById(`card-${wi}-${qi}`);
      if (card.dataset.answered) return;
      card.dataset.answered = '1';

      const q = weeks[wi].questions[qi];
      const isCorrect = chosen === q.correct;
      card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

      card.querySelectorAll('.option-btn').forEach(btn => {
        btn.disabled = true;
        const l = btn.dataset.letter;
        if (l === q.correct) btn.classList.add('correct');
        else if (l === chosen && !isCorrect) btn.classList.add('wrong');
        else btn.classList.add('muted');
      });

      const exp = document.getElementById(`explainer-${wi}-${qi}`);
      if (exp) exp.classList.add('visible');
    }

    function toggleMenu() {
      document.getElementById('burgerBtn').classList.toggle('open');
      document.getElementById('navMenu').classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('header')) {
        document.getElementById('burgerBtn').classList.remove('open');
        document.getElementById('navMenu').classList.remove('open');
      }
    });

    loadArchive();
  </script>
</body>
</html>
